<script>
  (function () {
    "use strict";

    function initializeIrisEntryPoint() {
      var input = document.getElementById("vcInput");
      var submitButton = document.getElementById("vcSubmitBtn");
      var micButton = document.getElementById("vcMicBtn");
      var status = document.getElementById("vcStatus");

      if (!input || !submitButton || !micButton) {
        return;
      }

      if (input.getAttribute("data-iris-initialized") === "true") {
        return;
      }

      input.setAttribute("data-iris-initialized", "true");

      var wrapper = input.closest(".vc-wrapper");
      var recognition = null;
      var isListening = false;
      var speechFailed = false;
      var finalTranscript = "";
      var silenceTimer = null;

      function announce(message) {
        if (status) {
          status.textContent = message;
        }
      }

      function updateButtonState() {
        var hasValue = input.value.trim().length > 0;

        submitButton.disabled = !hasValue || isListening;
        submitButton.classList.toggle(
          "vc-action-hidden",
          !hasValue || isListening
        );

        micButton.classList.toggle(
          "vc-action-hidden",
          hasValue && !isListening
        );
      }

      function submitInput() {
        var value = input.value.trim();

        if (value && !isListening) {
          window.location.href =
            "/ai/default.aspx?search=" + encodeURIComponent(value);
        }
      }

      function clearSilenceTimer() {
        if (silenceTimer !== null) {
          window.clearTimeout(silenceTimer);
          silenceTimer = null;
        }
      }

      function stopRecognition() {
        clearSilenceTimer();

        if (recognition && isListening) {
          recognition.stop();
        }
      }

      input.addEventListener("input", updateButtonState);

      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.isComposing) {
          event.preventDefault();
          submitInput();
        }
      });

      submitButton.addEventListener("click", function (event) {
        event.preventDefault();
        submitInput();
      });

      wrapper.querySelectorAll(".vc-pill").forEach(function (button) {
        button.addEventListener("click", function (event) {
          event.preventDefault();

          if (isListening) {
            speechFailed = true;
            stopRecognition();
          }

          input.value =
            button.getAttribute("data-value") ||
            button.textContent.trim();

          updateButtonState();
          input.focus();
        });
      });

      var SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = function () {
          isListening = true;
          micButton.classList.add("active");
          micButton.setAttribute("aria-label", "Stop voice input");
          micButton.setAttribute("title", "Stop voice input");
          announce("Listening.");
          updateButtonState();
        };

        recognition.onresult = function (event) {
          if (speechFailed) {
            return;
          }

          var interimTranscript = "";

          for (var i = event.resultIndex; i < event.results.length; i++) {
            var transcript = event.results[i][0].transcript;

            if (event.results[i].isFinal) {
              finalTranscript += transcript + " ";
            } else {
              interimTranscript += transcript;
            }
          }

          input.value = (finalTranscript + interimTranscript).trim();
          updateButtonState();

          clearSilenceTimer();
          silenceTimer = window.setTimeout(stopRecognition, 1200);
        };

        recognition.onspeechend = stopRecognition;

        recognition.onerror = function (event) {
          speechFailed = true;
          clearSilenceTimer();

          var message = "Voice input failed. Please type your request.";

          if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed"
          ) {
            message =
              "Microphone access was blocked. Please type your request.";
          } else if (event.error === "no-speech") {
            message = "No speech was detected. Please try again or type.";
          }

          announce(message);
        };

        recognition.onend = function () {
          clearSilenceTimer();
          isListening = false;

          micButton.classList.remove("active");
          micButton.setAttribute("aria-label", "Use voice input");
          micButton.setAttribute("title", "Use voice input");

          updateButtonState();

          if (!speechFailed && input.value.trim()) {
            announce("Opening IRIS.");
            submitInput();
          }
        };
      }

      micButton.addEventListener("click", function (event) {
        event.preventDefault();

        if (!recognition) {
          announce(
            "Voice input is not supported in this browser. Please type."
          );
          input.focus();
          return;
        }

        if (isListening) {
          stopRecognition();
          return;
        }

        speechFailed = false;
        finalTranscript = "";

        try {
          recognition.start();
        } catch (error) {
          speechFailed = true;
          isListening = false;
          updateButtonState();
          announce("Unable to start voice input. Please type your request.");
        }
      });

      updateButtonState();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initializeIrisEntryPoint);
    } else {
      initializeIrisEntryPoint();
    }
  })();

  var heroSlider = "";

  function initHeroSlider() {
    const heroSliderElement = document.getElementById("hero-slider");

    // Do nothing if hero slider was not created
    if (!heroSliderElement) return;

    // Count only real slides, not cloned lightSlider slides
    const realSlides = heroSliderElement.querySelectorAll("li:not(.clone)");

    // If there is only the main banner, do NOT activate slider
    if (realSlides.length <= 1) {
      heroSliderElement.style.opacity = "1";
      return;
    }

    if (heroSlider.lightSlider && typeof heroSlider.destroy === "function") {
      heroSlider.destroy();
    }

    heroSlider = $("#hero-slider").lightSlider({
      item: 1,
      loop: true,
      auto: true,
      autoWidth: false,
      easing: "cubic-bezier(0.25, 0, 0.25, 1)",
      speed: 1000,
      pauseOnHover: true,
      pager: false,
      pause: 8000,
      onSliderLoad: function () {
        $("#hero-slider").css("opacity", 1);
      },
      onBeforeSlide: function () {
        let videos = document.querySelectorAll("#hero-slider video");
        videos.forEach((video) => {
          video.pause();
          video.currentTime = 0;
        });
      },
      onAfterSlide: function () {
        let videos = document.querySelectorAll("#hero-slider video");
        videos.forEach((video) => {
          video.play();
          video.currentTime = 0;
        });
      },
    });
  }

      carouselImage.src = carouselImages[currentImageIndex].src;
      carouselImage.alt = carouselImages[currentImageIndex].alt;

      // Reset the auto-advance timer whenever manual navigation occurs
      resetAutoAdvance();
    }
  }

  function nextImage() {
    const nextIndex = (currentImageIndex + 1) % carouselImages.length;
    goToImage(nextIndex);
  }

  function prevImage() {
    const prevIndex = (currentImageIndex - 1 + carouselImages.length) % carouselImages.length;
    goToImage(prevIndex);
  }

  function startAutoAdvance() {
    autoAdvanceInterval = setInterval(() => {
      nextImage();
    }, 5000); // 3 seconds
  }

  function resetAutoAdvance() {
    clearInterval(autoAdvanceInterval);
    startAutoAdvance();
  }

  // Initialize the carousel
  carouselImage.src = carouselImages[0].src;
  carouselImage.alt = carouselImages[0].alt;
  startAutoAdvance();

  // Event listeners for manual navigation
  nextBtnLens.addEventListener('click', nextImage);
  prevBtnLens.addEventListener('click', prevImage);

  // Pause auto-advance when hovering over carousel
  carouselImage.parentElement.addEventListener('mouseenter', () => {
    clearInterval(autoAdvanceInterval);
  });

  carouselImage.parentElement.addEventListener('mouseleave', () => {
    startAutoAdvance();
  });



  document.addEventListener('DOMContentLoaded', function () {
    const container = document.querySelector('.info-boxes-container');
    const progressBar = document.querySelector('.slider-progress-bar');

    if (container && progressBar) {
      container.addEventListener('scroll', function () {

        const scrollWidth = container.scrollWidth - container.clientWidth;
        const scrollPosition = container.scrollLeft;
        const progress = (scrollPosition / scrollWidth) * 75;
        progressBar.style.width = `${25 + progress}%`;
      });
    }
  });

  const toggleBrands = (function () {
    function toggle(button) {
      const clickedCard = button.closest('.eyewear-card');
      const clickedBottom = clickedCard.querySelector('.card-bottom');

      const isAlreadyOpen = clickedBottom.style.display === 'block';

      // Close all other cards
      document.querySelectorAll('.eyewear-card').forEach(card => {
        const bottom = card.querySelector('.card-bottom');
        const btn = card.querySelector('.see-brands-btn');
        if (bottom) bottom.style.display = 'none';
        if (btn) btn.textContent = 'See brands';
        card.style.margin = "0px";
        card.style.maxHeight = "144px";
        card.classList.remove("active");
      });

      // Toggle clicked card
      if (!isAlreadyOpen) {
        clickedBottom.style.display = 'block';
        button.textContent = 'Hide';
        clickedCard.style.margin = "0px 0px 40px";
        clickedCard.style.maxHeight = "315px";
        clickedCard.classList.add("active");

      }
    }

    // Auto-expand first card on page load
    document.addEventListener('DOMContentLoaded', () => {
      const firstCard = document.querySelector('.eyewear-card');
      if (firstCard) {
        const bottom = firstCard.querySelector('.card-bottom');
        const btn = firstCard.querySelector('.see-brands-btn');
        if (bottom) bottom.style.display = 'block';
        if (btn) btn.textContent = 'Hide';
        firstCard.style.margin = "0px 0px 40px";
        firstCard.style.maxHeight = "315px";
        firstCard.classList.add("active");
      }
    });

    return toggle;
  })();
  document.addEventListener('DOMContentLoaded', function () {
    const slider = document.getElementById('perfectPairSlider');
    const progressBar = document.getElementById('perfectPairProgressBar');

    if (!slider || !progressBar) return;

    function updatePerfectPairProgress() {
      const maxScroll = slider.scrollWidth - slider.clientWidth;
      const progress = maxScroll > 0 ? (slider.scrollLeft / maxScroll) * 100 : 0;
      progressBar.style.width = `${progress}%`;
    }

    slider.addEventListener('scroll', updatePerfectPairProgress, { passive: true });
    window.addEventListener('resize', updatePerfectPairProgress);

    updatePerfectPairProgress();
  });
  document.addEventListener("DOMContentLoaded", function () {
    const container = document.getElementById("carouselContainer");
    const track = document.getElementById("carouselTrackcard");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressBar = document.getElementById("progressBar");

    if (!container || !track || !prevBtn || !nextBtn) return;

    let currentX = 0;

    function getStep() {
      const firstCard = track.querySelector(".cardStyle");
      const gap = parseFloat(getComputedStyle(track).gap) || 0;
      return firstCard.getBoundingClientRect().width + gap;
    }

    function getMaxX() {
      return Math.max(0, track.scrollWidth - container.clientWidth);
    }

    function updateCarousel() {
      const maxX = getMaxX();

      currentX = Math.max(0, Math.min(currentX, maxX));

      track.style.transform = `translateX(-${currentX}px)`;

      if (progressBar) {
        const totalWidth = track.scrollWidth;
        const visibleWidth = container.clientWidth;

        const percentage = totalWidth > 0
          ? Math.min(100, ((currentX + visibleWidth) / totalWidth) * 100)
          : 100;

        progressBar.style.width = `${percentage}%`;
      }
    }
    nextBtn.addEventListener("click", function () {
      currentX = Math.min(currentX + getStep(), getMaxX());
      updateCarousel();
    });

    prevBtn.addEventListener("click", function () {
      currentX = Math.max(currentX - getStep(), 0);
      updateCarousel();
    });

    window.addEventListener("resize", updateCarousel);

    updateCarousel();
  });


  // STICKY HEADER
  function initHeroOffers() {
    const offers = document.getElementById("fdHeroOffers");
    const hero = offers && offers.closest(".ct_banner.ct_hero");

    if (!offers || !hero || offers.dataset.initialized === "true") return;
    offers.dataset.initialized = "true";

    let inactivityTimer;
    let isShown = false;
    let ticking = false;

    function headerBottom() {
      const stack = document.elementsFromPoint(window.innerWidth / 2, 2);

      for (const element of stack) {
        let el = element;

        while (el && el !== document.body && el !== document.documentElement) {
          // Ignore the offers and their children.
          if (el === offers || offers.contains(el)) break;

          const style = getComputedStyle(el);

          if (style.position === "fixed" || style.position === "sticky") {
            const rect = el.getBoundingClientRect();

            if (rect.height <= 160 && rect.bottom > 0) {
              return rect.bottom;
            }

            break;
          }

          el = el.parentElement;
        }
      }

      return 0;
    }

    function updatePosition() {
      ticking = false;

      const headerHeight = Math.round(headerBottom());
      const heroRect = hero.getBoundingClientRect();

      // Në fillim të faqes: gjithmonë i ngjitur nën header
      if (window.scrollY <= 0 || heroRect.top >= headerHeight) {
        offers.style.setProperty("top", Math.max(heroRect.top, headerHeight) + "px", "important");
        offers.classList.remove("fd-out");
        return;
      }

      const shift = Math.min(0, Math.round(heroRect.bottom - headerHeight - offers.offsetHeight));
      offers.style.setProperty("top", (headerHeight + shift) + "px", "important");

      // Fshihe vetëm kur hero-ja ka dalë krejt nga ekrani
      offers.classList.toggle("fd-out", heroRect.bottom <= headerHeight);
    }

    function showOffers() {
      if (isShown) return;

      isShown = true;
      clearTimeout(inactivityTimer);

      offers.classList.add("fd-show");
      offers.setAttribute("aria-hidden", "false");

      updatePosition();
    }

    function resetTimer() {
      clearTimeout(inactivityTimer);
      if (isShown) return;

      inactivityTimer = setTimeout(showOffers, 10000);
    }

    function schedulePositionUpdate() {
      if (ticking) return;

      ticking = true;
      requestAnimationFrame(updatePosition);
    }

    window.addEventListener("scroll", function () {
      if (window.scrollY > 40) {
        showOffers();
      } else {
        resetTimer();
      }

      schedulePositionUpdate();
    }, { passive: true });

    window.addEventListener("resize", schedulePositionUpdate);

    ["mousemove", "keydown", "touchstart", "click"].forEach(function (eventName) {
      window.addEventListener(eventName, resetTimer, { passive: true });
    });

    // Rotate offers on mobile.
    const links = offers.querySelectorAll(".fd-hero-offer");

    if (links.length > 1) {
      const offerData = Array.from(links, function (link) {
        return {
          href: link.getAttribute("href"),
          html: link.innerHTML
        };
      });

      let currentOffer = 0;

      setInterval(function () {
        if (!isShown || window.innerWidth > 767) return;

        currentOffer = (currentOffer + 1) % offerData.length;

        links[0].setAttribute("href", offerData[currentOffer].href);
        links[0].innerHTML = offerData[currentOffer].html;
      }, 10000);
    }

    updatePosition();

    if (window.scrollY > 40) {
      showOffers();
    } else {
      resetTimer();
    }
  }
  /*countdown*/
  function fdCountdown(endDate) {
    function pad(n) { return n < 10 ? '0' + n : n; }

    var timer;

    function tick() {
      var els = document.querySelectorAll('.fd-countdown');
      var diff = endDate - new Date();

      // hide if more than 24h away (before Oct 28) or already ended
      if (diff <= 0 || diff > 86400000) {
        els.forEach(function (el) { el.style.display = 'none'; });
        if (diff <= 0) clearInterval(timer);
        return;
      }

      var h = Math.floor(diff / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      var s = Math.floor((diff % 60000) / 1000);
      var txt = pad(h) + ':' + pad(m) + ':' + pad(s);

      els.forEach(function (el) {
        el.style.display = 'block';
        el.textContent = txt;
      });
    }

    tick();
    timer = setInterval(tick, 1000);
  }

  // Ends Oct 29, 00:00 -> visible Oct 28 00:00 to Oct 29 00:00
  fdCountdown(new Date('2026-10-30T00:00:00-04:00'));
  /*sitkcy banner*/

  (function () {
    function start() {
      if (typeof initHeroOffers === "function") initHeroOffers();
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", start);
    } else {
      start();
    }
  })();
</script>
